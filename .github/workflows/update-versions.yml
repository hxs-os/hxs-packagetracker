name: Update versions.json

on:
  push:
    branches: [main]
  pull_request:

jobs:
  update-versions:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: create venv
        run: |
          python -m venv .venv

          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r scripts/updater/requirements.txt

      - name: generate versions file
        run: .venv/bin/python scripts/updater/update-versions.py

      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions.json
          git commit -m "update package index" || true
          git push
